<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Osiris RP · Ouverture officielle du projet</title>
<meta name="description" content="Ouverture officielle du projet Osiris : samedi 31 octobre 2026, 21 h.">
<meta name="theme-color" content="#0A0B0D">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png?v=2">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Osiris RP">
<meta property="og:title" content="Osiris RP · Ouverture officielle du projet">
<meta property="og:description" content="Samedi 31 octobre 2026, 21 h.">
<meta property="og:image" content="https://osiriswl.vercel.app/img/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/fonts/polices.css">
<link rel="preload" as="image" href="/img/oeil.webp" type="image/webp">
<style>
/* Le décompte : la seule page que le public voit avant l'ouverture officielle (middleware.js). */
:root{
  color-scheme: dark;
  --ground:#0A0B0D; --line:#23262C; --bone:#E6E0D3; --dim:#8B877D; --faint:#55534D;
  --brass:#C4A265; --gold:#E9CF78; --alarm:#B5564A;
  --display:"Marcellus", Georgia, serif; --serif:"Source Serif 4", Georgia, serif; --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{background:var(--ground);height:100%}
body{margin:0;color:var(--bone);font-family:var(--serif);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:clip;display:flex;flex-direction:column;min-height:100svh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);z-index:3}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(ellipse 60% 50% at 50% 42%,rgba(196,162,101,.07),transparent 70%)}
[hidden]{display:none!important}
main{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px;padding:48px 16px 24px}
.oeil{width:min(320px,62vw,calc(34svh * 1.2));aspect-ratio:1051/877;mix-blend-mode:screen;opacity:0;animation:apparait 2.4s ease-out .2s forwards}
.oeil img{width:100%;height:auto;display:block}
.marque{display:flex;flex-direction:column;align-items:center;gap:12px}
.mot{font-family:var(--display);font-size:clamp(28px,4.4vw,48px);line-height:1;letter-spacing:.3em;margin-right:-.3em;white-space:nowrap;background:linear-gradient(180deg,#fbf0b8 0%,#e9cf78 45%,#a9853f 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.trait{width:min(460px,70vw);height:1px;background:linear-gradient(90deg,rgba(233,207,120,0),rgba(233,207,120,.85),rgba(233,207,120,0));position:relative}
.trait::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;background:var(--gold);transform:translate(-50%,-50%) rotate(45deg)}
.titre{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--bone)}
.titre i{width:8px;height:8px;border-radius:50%;background:var(--alarm);box-shadow:0 0 10px var(--alarm);animation:pouls 2.4s ease-in-out infinite;flex:none}
.compte{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.compte div{background:rgba(10,11,13,.86);padding:16px 8px 12px;min-width:clamp(70px,12vw,124px);display:flex;flex-direction:column;align-items:center;gap:6px}
.compte b{font-family:var(--mono);font-weight:400;font-size:clamp(32px,5.6vw,58px);line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.compte span{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.date{margin:0;font-family:var(--display);font-size:clamp(20px,2.6vw,26px);letter-spacing:.04em}
.heure{font-family:var(--display);font-size:clamp(34px,6vw,58px);line-height:1.1;letter-spacing:.04em;color:var(--gold)}
footer{position:relative;display:flex;justify-content:center;gap:18px;flex-wrap:wrap;padding:18px 16px 26px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
footer a{color:inherit;text-decoration:none} footer a:hover{color:var(--bone)}
@media (max-width:640px){body.a-filtre footer{padding-bottom:72px}}
@keyframes apparait{to{opacity:1}}
@keyframes pouls{50%{opacity:.25}}
@media (max-width:480px){.compte div{min-width:0;padding:12px 4px 10px}.titre{font-size:11px;letter-spacing:.14em}main{gap:18px}}
@media (prefers-reduced-motion:reduce){.oeil{animation:none;opacity:1}.titre i{animation:none}}
</style>
</head>
<body>
<main>
  <div class="oeil"><img src="/img/oeil.webp" alt="L'Œil d'Osiris" width="1051" height="877"></div>
  <div class="marque" aria-hidden="true"><div class="mot">OSIRIS RP</div><div class="trait"></div></div>
  <h1 class="titre"><i aria-hidden="true"></i>Ouverture officielle du projet</h1>
  <div class="compte" id="compte" role="timer" aria-label="Temps avant l'ouverture officielle du projet">
    <div><b id="j">—</b><span>jours</span></div>
    <div><b id="h">—</b><span>heures</span></div>
    <div><b id="m">—</b><span>minutes</span></div>
    <div><b id="s">—</b><span>secondes</span></div>
  </div>
  <div class="heure" id="heure" hidden>C'est l'heure.</div>
  <p class="date">Samedi 31 octobre 2026 · 21 h</p>
</main>
<footer>
  <span>© Osiris RP</span>
  <a href="/legal">Mentions légales</a>
  <a href="/api/auth/login?retour=accueil">Équipe</a>
</footer>
<script>
(function(){
  var OUVERTURE = new Date("2026-10-31T21:00:00+01:00").getTime();
  var $ = function(id){ return document.getElementById(id) };
  var deux = function(n){ return (n < 10 ? "0" : "") + n };
  var fini = false, ecart = 0;
  // L'heure du serveur (en-tête Date), pour ne pas se fier à l'horloge de l'appareil.
  fetch("/favicon.ico", { method: "HEAD", cache: "no-store" }).then(function(r){
    var t = Date.parse(r.headers.get("date") || ""); if(t) ecart = t - Date.now(); tic();
  }).catch(function(){});
  function tic(){
    var reste = Math.floor((OUVERTURE - (Date.now() + ecart)) / 1000);
    if(reste <= 0){
      if(fini) return; fini = true;
      $("compte").hidden = true; $("heure").hidden = false;
      // Le site s'ouvre : on recharge (le serveur sert alors la vraie page).
      setTimeout(function(){ location.replace(location.pathname === "/bientot" ? "/" : location.href) }, 1800);
      return;
    }
    $("j").textContent = Math.floor(reste / 86400);
    $("h").textContent = deux(Math.floor(reste % 86400 / 3600));
    $("m").textContent = deux(Math.floor(reste % 3600 / 60));
    $("s").textContent = deux(reste % 60);
  }
  tic(); setInterval(tic, 1000);
})();
</script>
<script src="/filtre.js" defer></script>
</body>
</html>
