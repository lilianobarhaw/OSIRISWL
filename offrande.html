<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Offrande en cours · Osiris</title>
<!--
  Le vote des Offrandes en direct, pour OBS (source « Navigateur », 1920 × 1080, fond transparent).
  - https://<site>/offrande                  → le vote en cours (barres, compte à rebours), puis le résultat
  - https://<site>/offrande?position=gauche  → le panneau à gauche (droite par défaut ; aussi « centre »)
  - https://<site>/offrande?resultat=90      → le résultat reste 90 secondes à l'écran (60 par défaut)
  - https://<site>/offrande?demo=1           → un faux vote d'une minute, pour régler la scène
  N'affiche rien tant qu'aucune Offrande n'est lancée avec l'option « écran » (/offrande, oui par défaut).
  Le compte réunit les votes du sondage Discord et ceux du site, sans doublon (lib/offrande.js).
-->
<link rel="stylesheet" href="/fonts/polices.css">
<style>
  :root {
    --ground: #0A0B0D; --panel: #111317; --line: #23262C;
    --bone: #E6E0D3; --dim: #8B877D; --faint: #55534D;
    --brass: #C4A265; --gold: #E9CF78; --alarm: #B5564A;
    --display: "Marcellus", Georgia, serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    --serif: "Source Serif 4", Georgia, serif;
  }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; color: var(--bone); }

  .panneau {
    position: fixed; top: 110px; right: 60px; width: 640px;
    background: linear-gradient(180deg, rgba(17,19,23,.95), rgba(10,11,13,.97));
    border: 1px solid var(--brass); box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.6);
    padding: 26px 30px 24px;
    opacity: 0; transform: translateX(60px);
    transition: opacity .7s ease, transform .7s cubic-bezier(.2,.8,.2,1);
  }
  body.gauche .panneau { right: auto; left: 60px; transform: translateX(-60px); }
  body.centre .panneau { right: auto; left: 50%; top: 50%; transform: translate(-50%, -46%); }
  .panneau.visible { opacity: 1; transform: none; }
  body.centre .panneau.visible { transform: translate(-50%, -50%); }
  /* coins, comme les écrans du site */
  .panneau::before { content: ""; position: absolute; inset: 8px; pointer-events: none; opacity: .9;
    background: linear-gradient(var(--gold),var(--gold)) left top/18px 1px no-repeat, linear-gradient(var(--gold),var(--gold)) left top/1px 18px no-repeat,
      linear-gradient(var(--gold),var(--gold)) right top/18px 1px no-repeat, linear-gradient(var(--gold),var(--gold)) right top/1px 18px no-repeat,
      linear-gradient(var(--gold),var(--gold)) left bottom/18px 1px no-repeat, linear-gradient(var(--gold),var(--gold)) left bottom/1px 18px no-repeat,
      linear-gradient(var(--gold),var(--gold)) right bottom/18px 1px no-repeat, linear-gradient(var(--gold),var(--gold)) right bottom/1px 18px no-repeat; }

  .tete { display: flex; align-items: center; justify-content: space-between; gap: 14px; font-family: var(--mono); font-size: 15px; letter-spacing: .26em; text-transform: uppercase; color: var(--brass); }
  .tete .marque { display: flex; align-items: center; gap: 12px; }
  .tete img { height: 34px; mix-blend-mode: lighten; }
  .rec { display: inline-flex; align-items: center; gap: 9px; color: var(--bone); font-size: 13px; letter-spacing: .2em; }
  .rec::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--alarm); box-shadow: 0 0 10px rgba(181,86,74,.9); animation: clignote 1.6s steps(2, start) infinite; }
  .fini .rec::before { background: var(--gold); box-shadow: 0 0 10px rgba(233,207,120,.8); animation: none; }
  @keyframes clignote { to { visibility: hidden; } }

  .titre { font-family: var(--display); font-weight: 400; font-size: 40px; line-height: 1.1; margin: 16px 0 0; letter-spacing: .02em; }
  .chrono { font-family: var(--mono); font-size: 66px; line-height: 1; color: var(--gold); margin-top: 12px; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
  .chrono.urgent { color: #E6806F; animation: pouls 1s ease-in-out infinite; }
  @keyframes pouls { 50% { opacity: .55; } }
  .verdict { display: none; font-family: var(--display); font-size: 50px; line-height: 1.08; color: var(--gold); margin-top: 12px; text-shadow: 0 0 30px rgba(233,207,120,.35); }
  .fini .chrono { display: none; }
  .fini .verdict { display: block; animation: apparait 1.2s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes apparait { from { opacity: 0; letter-spacing: .3em; filter: blur(10px); } to { opacity: 1; letter-spacing: 0; filter: none; } }

  .options { margin-top: 22px; display: flex; flex-direction: column; gap: 16px; }
  .opt .ligne { display: flex; align-items: baseline; gap: 12px; font-size: 28px; }
  .opt .em { font-size: 26px; width: 34px; }
  .opt .ch { font-family: var(--mono); font-size: 16px; letter-spacing: .14em; color: var(--brass); width: 34px; }
  .opt .nom { flex: 1; font-family: var(--serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .opt .pct { font-family: var(--mono); font-size: 28px; font-variant-numeric: tabular-nums; color: var(--bone); }
  .opt .barre { position: relative; height: 12px; margin-top: 10px; background: rgba(255,255,255,.05); border: 1px solid var(--line); overflow: hidden; }
  .opt .barre i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #8E7747, var(--brass) 60%, var(--gold)); transition: width 1.1s cubic-bezier(.2,.8,.2,1); }
  .opt .nb { font-family: var(--mono); font-size: 13px; letter-spacing: .12em; color: var(--faint); margin-top: 6px; text-transform: uppercase; }
  .opt.tete-course .pct { color: var(--gold); }
  .fini .opt { opacity: .35; transition: opacity .8s ease; }
  .fini .opt.gagnant { opacity: 1; }
  .fini .opt.gagnant .barre i { background: var(--gold); box-shadow: 0 0 18px rgba(233,207,120,.6); }
  .fini .opt.gagnant .nom { color: var(--gold); }

  .pied { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; font-family: var(--mono); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .pied b { font-weight: 400; color: var(--bone); }
  @media (prefers-reduced-motion: reduce) { .panneau, .opt .barre i { transition: none; } .rec::before, .chrono.urgent { animation: none; } }
</style>
</head>
<body>
<section class="panneau" id="panneau" aria-live="polite">
  <div class="tete">
    <span class="marque"><img src="/img/oeil.webp" alt=""><span id="etiquette">Offrande des Mécènes</span></span>
    <span class="rec" id="rec">Vote en cours</span>
  </div>
  <h1 class="titre" id="titre"></h1>
  <div class="chrono" id="chrono">--:--</div>
  <div class="verdict" id="verdict"></div>
  <div class="options" id="options"></div>
  <div class="pied"><span id="pied-votes"></span><span id="pied-lien"></span></div>
</section>

<script>
(() => {
  const q = new URLSearchParams(location.search);
  const DEMO = q.has("demo");
  const RESULTAT_S = Number(q.get("resultat")) || 60;
  if (q.get("position") === "gauche") document.body.classList.add("gauche");
  if (q.get("position") === "centre") document.body.classList.add("centre");
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const nf = new Intl.NumberFormat("fr-FR");
  let d = null, ecart = 0, cle = "";
  $("pied-lien").innerHTML = `Votez · Discord ou <b>${esc(location.host)}/salle</b>`;

  // une démonstration : un vote d'une minute, puis le résultat 20 secondes, en boucle
  const t0 = Date.now();
  function demo() {
    const cycle = 80000, t = (Date.now() - t0) % cycle, debut = Date.now() - t, fin = debut + 60000;
    const s = Math.min(t, 60000) / 1000;
    const votes = [Math.round(s * 0.9), Math.round(s * 1.25), Math.round(s * 0.45)];
    const total = votes.reduce((a, b) => a + b, 0);
    return {
      actif: true, maintenant: Date.now(), id: "demo" + Math.floor((Date.now() - t0) / cycle), titre: "Offrande de 22h", debut, fin, ferme: t >= 60000, total,
      options: ["Le blizzard", "La panne", "La lettre"].map((nom, k) => ({ nom, emoji: ["❄️", "🕯️", "🗝️"][k], chiffre: ["I", "II", "III"][k], votes: votes[k], pct: total ? Math.round(votes[k] / total * 1000) / 10 : 0 })),
      gagnant: t >= 60000 ? 1 : null, egalite: null,
    };
  }

  function rendre() {
    const p = $("panneau");
    const maintenant = Date.now() + ecart;
    const montre = !!(d && d.actif && (!d.ferme || maintenant < d.fin + RESULTAT_S * 1000));
    p.classList.toggle("visible", montre);
    if (!d || !d.actif) return;
    // une nouvelle Offrande : on reconstruit les lignes
    if (cle !== d.id + ":" + d.options.length) {
      cle = d.id + ":" + d.options.length;
      $("options").innerHTML = d.options.map((o, k) => `<div class="opt" data-k="${k}"><div class="ligne"><span class="em">${esc(o.emoji)}</span><span class="ch">${esc(o.chiffre)}</span><span class="nom">${esc(o.nom)}</span><span class="pct"></span></div><div class="barre"><i></i></div><div class="nb"></div></div>`).join("");
    }
    $("titre").textContent = d.titre;
    const max = Math.max(...d.options.map((o) => o.votes));
    d.options.forEach((o, k) => {
      const el = $("options").children[k]; if (!el) return;
      el.querySelector(".pct").textContent = Math.round(o.pct) + " %";
      el.querySelector(".barre i").style.width = o.pct + "%";
      el.querySelector(".nb").textContent = nf.format(o.votes) + " vote" + (o.votes > 1 ? "s" : "");
      el.classList.toggle("tete-course", !d.ferme && o.votes === max && max > 0);
      el.classList.toggle("gagnant", d.ferme && (d.gagnant === k || (d.egalite || []).includes(k)));
    });
    p.classList.toggle("fini", !!d.ferme);
    $("etiquette").textContent = d.ferme ? (d.gagnant !== null ? "L'Offrande est choisie" : d.total ? "Égalité" : "Aucun vote") : "Offrande des Mécènes";
    $("rec").textContent = d.ferme ? "Vote clos" : "Vote en cours";
    $("verdict").textContent = d.ferme ? (d.gagnant !== null ? d.options[d.gagnant].nom : d.total ? "La régie tranche." : "Osiris décidera.") : "";
    $("pied-votes").innerHTML = `<b>${nf.format(d.total)}</b> Mécène${d.total > 1 ? "s" : ""}`;
    chrono();
  }

  function chrono() {
    if (!d || !d.actif || d.ferme) return;
    const reste = Math.max(0, d.fin - (Date.now() + ecart));
    const s = Math.ceil(reste / 1000);
    $("chrono").textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
    $("chrono").classList.toggle("urgent", s <= 30);
  }

  async function charger() {
    if (DEMO) { d = demo(); ecart = 0; return rendre(); }
    try {
      const r = await fetch("/api/rangs?offrande=1", { cache: "no-store" });
      const n = await r.json();
      if (n.maintenant) ecart = n.maintenant - Date.now();
      d = n;
    } catch {}
    rendre();
  }
  charger();
  setInterval(charger, 2000);
  setInterval(() => { chrono(); if (d && d.ferme) rendre(); }, 250);
})();
</script>
</body>
</html>
